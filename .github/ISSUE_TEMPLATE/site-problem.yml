name: Website problem
description: Report a search, display, navigation, or accessibility problem.
title: "[Site problem]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page URL, search terms, and category when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
